name: Links cortos con vista previa
on:
  schedule: [{ cron: "*/10 * * * *" }]
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/links-cortos.yml", ".github/scripts/links-cortos.mjs", "v/index.html"]
permissions:
  contents: write
concurrency: { group: links-cortos, cancel-in-progress: false }
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/links-cortos.mjs
      - run: |
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name="desabollito-bot" -c user.email="bot@desabollito.com" commit -qm "Links cortos"
          git pull -q --rebase origin main && git push -q origin main
