name: DNS dominio
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/dns.yml"]
jobs:
  dns:
    runs-on: ubuntu-latest
    steps:
      - name: Registros para GitHub Pages
        env:
          CF: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          H=(-H "Authorization: Bearer $CF" -H "Content-Type: application/json")
          Z=$(curl -s "${H[@]}" "https://api.cloudflare.com/client/v4/zones?name=desabollito.com")
          echo "zonas: $(echo "$Z" | jq -c '{success, errors, n: (.result|length)}')"
          ZID=$(echo "$Z" | jq -r '.result[0].id // empty')
          if [ -z "$ZID" ]; then echo "::warning::sin acceso a la zona desabollito.com"; exit 0; fi
          ex=$(curl -s "${H[@]}" "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?per_page=100")
          echo "existentes: $(echo "$ex" | jq -c '[.result[] | {type,name,content,proxied}]')"
          crear() { r=$(curl -s -X POST "${H[@]}" "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records" --data "$1"); echo "$1 -> $(echo "$r" | jq -c '{success, errors}')"; }
          for ip in 185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153; do
            crear "{\"type\":\"A\",\"name\":\"desabollito.com\",\"content\":\"$ip\",\"proxied\":false,\"ttl\":1}"
          done
          crear '{"type":"CNAME","name":"www","content":"desabollito.github.io","proxied":false,"ttl":1}'
          echo "::notice::listo $(curl -s "${H[@]}" "https://api.cloudflare.com/client/v4/zones/$ZID/dns_records?per_page=100" | jq -c '[.result[] | {type,name,content}]')"
