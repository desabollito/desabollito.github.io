name: Publicar reglas de Firestore
on:
  push:
    branches: [main]
    paths: ["firestore.rules", ".github/workflows/deploy-reglas.yml", ".github/scripts/reglas.mjs"]
  workflow_dispatch:
jobs:
  reglas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Publicar reglas
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/reglas.mjs
