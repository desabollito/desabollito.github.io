name: Ver resumen
on:
  push:
    branches: [main]
    paths: [".github/workflows/ver-resumen.yml"]
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/ver-resumen.mjs
