name: Quitar fotos de perfil (una vez)
on:
  push:
    branches: [main]
    paths: [".github/workflows/quitar-fotos.yml"]
jobs:
  quitar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Quitar fotos de perfil guardadas
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/quitar-fotos.mjs
