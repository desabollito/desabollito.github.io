name: Aviso de versión por WhatsApp
on:
  deployment_status:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
jobs:
  aviso:
    if: (github.event_name == 'deployment_status' && github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages') || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    concurrency: { group: aviso-version, cancel-in-progress: false }
    steps:
      - run: |
          sleep 20
          R=$(curl -sS -X POST -H "Content-Type: application/json" -d '{}' https://desabollito-bot.desabollito.workers.dev/aviso-version)
          echo "::notice::$R"
