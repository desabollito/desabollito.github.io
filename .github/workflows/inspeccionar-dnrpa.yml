name: Inspeccionar DNRPA (una vez)
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspeccionar-dnrpa.yml"]
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - name: Página y scripts
        run: |
          B=https://www2.jus.gov.ar/dnrpa-site/
          curl -sL "$B" -o index.html; echo "== index (${#}) =="; wc -c index.html
          grep -oE '(src|href)="[^"]+\.js[^"]*"' index.html | head -40
          grep -ioE 'recaptcha|captcha|hcaptcha|turnstile' index.html | sort | uniq -c
          for js in $(grep -oE 'src="[^"]+\.js[^"]*"' index.html | sed 's/src="//;s/"$//'); do
            case "$js" in http*) u="$js";; /*) u="https://www2.jus.gov.ar$js";; *) u="$B$js";; esac
            curl -sL "$u" -o s.js; echo "== $u $(wc -c < s.js)"
            grep -ioE 'recaptcha|captcha' s.js | sort | uniq -c
            grep -oE '.{0,160}identificarDominio.{0,300}' s.js | head -5
            grep -oE '["'"'"'][^"'"'"']*(api|rest|ws|service)[^"'"'"']*/[^"'"'"']*["'"'"']' s.js | sort -u | head -40
          done
