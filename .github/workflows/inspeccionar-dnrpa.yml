name: Inspeccionar DNRPA (una vez)
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspeccionar-dnrpa.yml"]
permissions:
  contents: write
jobs:
  ver:
    runs-on: ubuntu-latest
    steps:
      - name: Página y scripts
        run: |
          mkdir -p out && cd out
          exec > >(tee informe.txt) 2>&1
          B=https://www2.jus.gov.ar/dnrpa-site/
          curl -sL "$B" -o index.html; echo "== index (${#}) =="; wc -c index.html
          grep -oE '(src|href)="[^"]+\.js[^"]*"' index.html | head -40
          grep -ioE 'recaptcha|captcha|hcaptcha|turnstile' index.html | sort | uniq -c
          n=0
          for js in $(grep -oE 'src="[^"]+\.js[^"]*"' index.html | sed 's/src="//;s/"$//'); do
            case "$js" in http*) u="$js";; /*) u="https://www2.jus.gov.ar$js";; *) u="$B$js";; esac
            n=$((n+1)); f="script$n.js"; curl -sL "$u" -o "$f"; echo "== $f $u $(wc -c < $f)"
            grep -ioE 'recaptcha|captcha' "$f" | sort | uniq -c
          done
      - name: Guardar el informe en la rama debug
        run: |
          cd out && git init -q && git checkout -q -b debug && git add -A
          git -c user.name=bot -c user.email=bot@x commit -qm informe
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" debug
