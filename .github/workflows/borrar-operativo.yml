name: Borrar operativo sin miembros (una vez)
on:
  push:
    branches: [main]
    paths: [".github/workflows/borrar-operativo.yml"]
jobs:
  borrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Borrar operativo de Estefi (solo si no tiene miembros)
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node .github/scripts/borrar-operativo.mjs
