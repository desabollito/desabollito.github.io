<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    // Tema antes del primer pintado (evita el destello blanco)
    (function () {
      try {
        // Oscuro por defecto; el usuario lo cambia en Ajustes
        var t = localStorage.getItem("tema");
        document.documentElement.setAttribute("data-theme", t === "light" ? "light" : "dark");
      } catch (e) {}
    })();
  </script>
  <title>Desabollito</title>
  <meta name="description" content="Gestionate como un verdadero profesional.">
  <meta name="theme-color" content="#0e1b2c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Desabollito">
  <meta property="og:title" content="Desabollito">
  <meta property="og:description" content="Gestionate como un verdadero profesional.">
  <meta property="og:image" content="https://desabollito.github.io/img/app-512.png">
  <meta property="og:url" content="https://desabollito.github.io/">
  <link rel="icon" type="image/png" href="img/app-192.png">
  <link rel="apple-touch-icon" href="img/app-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>

<!-- Íconos (trazo 2px, estilo uniforme) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-car" viewBox="0 0 24 24"><path d="M5 17h14M5 17a2 2 0 1 1-4 0v-5l2.5-5.5A2 2 0 0 1 5.3 5.4h13.4a2 2 0 0 1 1.8 1.1L23 12v5a2 2 0 1 1-4 0"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M3 12h18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 10v10"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></symbol>
    <symbol id="i-team" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18.5 14.5A6.5 6.5 0 0 1 21.5 20"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-next" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><path d="M4 12v7a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7M16 6l-4-4-4 4M12 2v14"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M3 21l1.7-5A8.5 8.5 0 1 1 8 19.4Z"/><path d="M9 10.5c.3 1.6 2 3.3 3.6 3.6l1.1-1 1.8.8-.4 1.4c-3 .3-6.8-3.5-6.5-6.5L10 8.4l.8 1.8Z"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M14.5 4h-5L7.5 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3.5Z"/><circle cx="12" cy="13" r="3.5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="m21 15-5-5L5 21"/></symbol>
    <symbol id="i-flash" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7Z"/></symbol>
    <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><path d="M14 2v6h6M8 13h8M8 17h5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-sign" viewBox="0 0 24 24"><path d="M3 17c3-3 4-9 6-9s-1 9 2 9 3-5 5-5 1 4 3 4 2-1 2-1M3 21h18"/></symbol>
    <symbol id="i-restore" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5"/></symbol>
    <symbol id="i-logout" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M7 4 3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></symbol>
    <symbol id="i-sort" viewBox="0 0 24 24"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></symbol>
    <symbol id="i-money" viewBox="0 0 24 24"><path d="M12 2v20M17 5.5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/><path d="M3 5a2 2 0 0 0 2 2h14a2 2 0 0 1 2 2v3h-4a2 2 0 0 0 0 4h4"/></symbol>
    <symbol id="i-import" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
  </defs>
</svg>

<!-- Carga inicial -->
<div id="splash" class="splash"><img src="img/app-192.png" alt=""><span class="spin"></span></div>

<!-- Ingreso -->
<main id="login" class="login" hidden>
  <div class="login-art" aria-hidden="true"></div>
  <section class="login-card">
    <img class="login-logo logo-on-light" src="img/logo-oscuro.png" alt=""><img class="login-logo logo-on-dark" src="img/logo-claro.png" alt="">
    <h1>Desabollito</h1>
    <p class="login-sub">Gestionate como un verdadero profesional.</p>

    <div class="seg" role="tablist">
      <button role="tab" class="seg-btn on" data-modo="ingresar" aria-selected="true">Ingresar</button>
      <button role="tab" class="seg-btn" data-modo="crear" aria-selected="false">Crear cuenta</button>
    </div>

    <form id="login-form" class="stack" novalidate>
      <label class="field only-crear" hidden><span>Tu nombre</span>
        <input name="nombre" autocomplete="name" placeholder="Juan Pérez"></label>
      <label class="field"><span>Usuario</span>
        <input name="usuario" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="juanperez" required></label>
      <label class="field"><span>Contraseña</span>
        <input name="pass" type="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres" required></label>
      <button class="btn btn-primary btn-block btn-lg" id="login-submit">Ingresar</button>
    </form>

    <div class="login-or"><span>o</span></div>
    <button class="btn btn-google btn-block btn-lg" id="login-google">
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2A12 12 0 0 1 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3a12 12 0 0 1-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>
      Continuar con Google
    </button>
  </section>
</main>

<!-- App -->
<div id="shell" class="shell" hidden>
  <aside class="side" aria-label="Navegación principal">
    <button class="company-switch" id="company-switch" aria-label="Cambiar de operativo">
      <span class="company-avatar" id="company-avatar"></span>
      <span class="company-meta"><strong id="company-name">—</strong><small id="company-role"></small></span>
      <svg class="ic"><use href="#i-swap"/></svg>
    </button>
    <a class="btn btn-primary btn-block side-new" href="#/nuevo"><svg class="ic"><use href="#i-plus"/></svg>Nuevo vehículo</a>
    <nav class="side-nav">
      <a href="#/" data-nav="vehiculos"><svg class="ic"><use href="#i-car"/></svg>Vehículos</a>
      <a href="#/planilla" data-nav="planilla"><svg class="ic"><use href="#i-table"/></svg>Planilla</a>
      <a href="#/calendario" data-nav="calendario"><svg class="ic"><use href="#i-calendar"/></svg>Calendario</a>
      <a href="#/gastos" data-nav="gastos"><svg class="ic"><use href="#i-money"/></svg>Gastos</a>
    </nav>
    <div class="side-bottom">
      <div class="side-user">
        <div class="side-user-info" id="side-user"></div>
        <a class="icon-btn" href="#/ajustes" data-nav="ajustes" aria-label="Ajustes"><svg class="ic"><use href="#i-settings"/></svg></a>
      </div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar" id="topbar"></header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>

  <nav class="tabbar" aria-label="Navegación">
    <a href="#/" data-nav="vehiculos"><svg class="ic"><use href="#i-car"/></svg><span>Vehículos</span></a>
    <a href="#/calendario" data-nav="calendario"><svg class="ic"><use href="#i-calendar"/></svg><span>Calendario</span></a>
    <a href="#/planilla" id="tab-planilla" aria-label="Planilla (tocá de nuevo para Gastos)">
      <svg class="ic"><use href="#i-table"/></svg><span class="tab-label">Planilla</span>
      <span class="tab-dots" aria-hidden="true"><i></i><i></i></span></a>
  </nav>
  <a href="#/nuevo" class="fab" aria-label="Nuevo vehículo"><svg class="ic"><use href="#i-plus"/></svg></a>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
